<nav aria-label="Main">

  <button data-v="ov" onclick="go('ov')"><i class="ph ph-chart-bar" aria-hidden="true"></i>Ledger</button>
</nav>
<div id="toastWrap" role="status" aria-live="polite"><div id="toast"><span id="toast-msg"></span><button id="toast-undo" onclick="doUndo()">UNDO</button></div></div>

  <div class="vbar"><button aria-label="Close photo" onclick="closeViewer()"><i class="ph ph-x" aria-hidden="true"></i></button><span id="vcap"></span><button aria-label="Remove this photo" onclick="viewerRemove()"><i class="ph ph-trash" aria-hidden="true"></i></button></div>
  <div class="vimg" id="vimg" role="img" aria-label="Fade photo"></div>

</div>
<input type="file" id="importInput" accept=".json,application/json,text/plain" style="display:none" onchange="handleImport(this)">
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(this)">

<script>
if (!Array.prototype.at) Array.prototype.at = function (i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this[i]; };

const LS_KEY = 'denim_tracker_v1';

// ── Dates ──

const noon = s => new Date(s + 'T12:00:00');

// ── Storage ──

// ── Stats ──

// ── Calendar (Ledger › Calendar) ──
// Look comes from the pair's stored number (ci) via LOOKS: 21 colours × 3 fills = 63 looks. Past 63 they repeat.
const LOOK_NAMES = ['Amber', 'Sage', 'Sky', 'Rose', 'Cream', 'Orange', 'Lavender', 'Lime', 'Teal', 'Violet', 'Yellow', 'Blue', 'Magenta', 'Mint', 'Cyan', 'Emerald', 'Peach', 'Copper', 'Grape', 'Steel', 'Mustard'];
const NCOL = LOOK_NAMES.length;
// Order pairs get looks in: 1–12 solid, 13–21 striped (colours 1–9), 22–30 the 9 extra solids, then the remaining stripes, then dots.
const LOOKS = (() => { const L = [], r = (a, b) => Array.from({ length: b - a }, (_, i) => a + i), add = (cs, f) => cs.forEach(c => L.push([c, f]));
  add(r(0, 12), 0); add(r(0, 9), 1); add(r(12, 21), 0); add(r(9, 12), 1); add(r(12, 21), 1); add(r(0, 21), 2); return L; })();
const NLOOK = LOOKS.length, lk = k => LOOKS[k % NLOOK];
const colK = k => `var(--p${lk(k)[0] + 1})`, isPat = k => lk(k)[1] !== 0;
const fillK = k => { const c = colK(k), f = lk(k)[1]; return f === 1 ? `repeating-linear-gradient(135deg,${c} 0 4px,var(--pat) 4px 6px)` : f === 2 ? `radial-gradient(circle,var(--pat) 1.3px,transparent 1.8px) 0 0/6px 6px,${c}` : c; };

// Picker shows all solids first, then patterns.
const LOOK_ORDER = [...Array(NLOOK).keys()].sort((a, b) => lk(a)[1] - lk(b)[1] || a - b);
const lookOwner = (k, self) => DB.jeans.find(x => x !== self && x.ci % NLOOK === k);
const freeLook = () => { const u = new Set(DB.jeans.map(x => x.ci % NLOOK)); let k = 0; while (u.has(k) && k < NLOOK) k++; return k % NLOOK; };

const ringOf = parts => parts.filter(Boolean).join(',') || 'none';

    <button class="iconbtn" data-f="${fn}-p" data-fb="${fn}-n" aria-label="Previous ${unit}" ${prevDis ? 'disabled' : ''} onclick="${fn}(-1)"><i class="ph ph-caret-left" aria-hidden="true"></i></button>

}
function renderCal(js) {

  const E = d => days.get(d), name = j => `${esc(j.brand)} <span>${esc(j.model)}</span>`;

    days.forEach((e, d) => { if (+d.slice(0, 4) !== Y || d > t) return; if (e.w.length) yDays++; e.w.forEach(j => { yc.set(j.id, (yc.get(j.id) || 0) + 1); yW++; }); });
    if (calFocus && !yc.has(calFocus)) calFocus = null;
    const hi = id => fillK(findJ(id)?.ci ?? 0);
    const rows = Array.from({ length: 12 }, (_, m) => {
      const dim = new Date(Y, m + 1, 0).getDate(), past = Y < curY || m <= now.getMonth(), mn = new Date(Y, m, 1, 12).toLocaleDateString('en', { month: 'long' });

    }).join('');
    const yl = order.filter(j => yc.get(j.id)).sort((a, b) => yc.get(b.id) - yc.get(a.id) || byName(a, b));
    const op = id => !calFocus || calFocus === id ? 1 : .2;

function genDates(count, from, to) {
  const span = between(from, to) + 1;
  if (count <= 0 || span <= 0) return [];
  const n = Math.min(count, span);
  if (n === 1) return [to];
  return Array.from({ length: n }, (_, i) => shift(from, Math.round(i * (span - 1) / (n - 1))));
}

async function saveForm() {
  const t = today(), val = id => document.getElementById(id)?.value ?? '';
  const brand = val('fBrand').trim(), model = val('fModel').trim(), date = val('fDate'), priceRaw = String(val('fPrice')).trim();
  if (!brand || !model) { document.getElementById(brand ? 'fModel' : 'fBrand')?.focus(); return toast('Brand and model are required'); }
  if (date && !ISO_RE.test(date)) return toast('Purchase date is invalid');
  if (date && date > t) return toast("Purchase date can't be in the future");
  const price = priceRaw === '' ? null : Number(priceRaw);
  if (price !== null && (!Number.isFinite(price) || price < 0)) return toast('Price must be 0 or more');
  const int = id => { const v = String(val(id)).trim(); if (v === '') return null; const n = parseInt(v, 10); return Number.isFinite(n) ? n : NaN; };

  if (FS.editId) {
    const j = findJ(FS.editId); if (!j) return go('col');
    const snap = clone(j);
    const n = int('editSince');
    if (Number.isNaN(n) || (n !== null && n < 0)) return toast('Wears since wash must be 0 or more');
    if (n !== null) {
      // Regenerated wears end yesterday, or today if today is already logged, so the count never adds a wear for today.
      const lastWash = j.washes.at(-1) || null, end = j.wears.includes(t) ? t : shift(t, -1);
      const start = lastWash ? shift(lastWash, 1) : (date || j.purchaseDate || shift(t, -HISTORY_DAYS));
      const avail = Math.max(0, between(start, end) + 1);
      let final = n;
      if (n > avail) { if (!await showConfirm(`Only ${plural(avail, 'day')} available. The count will be capped at ${avail}. Continue?`, 'Continue')) return; final = avail; }
      const before = lastWash ? j.wears.filter(d => d <= lastWash) : [];
      j.wears = [...new Set([...before, ...genDates(final, start, end)])].sort();
    }
    Object.assign(j, { brand, model, purchaseDate: date || '', price: price || null });
    const o = FS.ci !== j.ci % NLOOK ? lookOwner(FS.ci, j) : null, oPrev = o?.ci;
    if (FS.ci !== j.ci % NLOOK) { if (o) o.ci = j.ci; j.ci = FS.ci; }
    if (!save()) { if (o) o.ci = oPrev; return rollback(snap); }
    toast('Saved'); return go('detail', j.id);
  }
  const nW = int('bfWears') ?? 0, nA = int('bfWashes') ?? 0, nS = int('bfSince') ?? 0;
  if ([nW, nA, nS].some(x => Number.isNaN(x) || x < 0)) return toast('Backfill numbers must be 0 or more');
  if (nS > nW) return toast("Since wash can't exceed past wears");
  if (nA === 0 && nS > 0 && nS !== nW) return toast('With no washes, since wash equals past wears');
  const from = date || shift(t, -HISTORY_DAYS), yest = shift(t, -1);
  let washes, wears;
  if (nA > 0 && nS > 0) {
    const mid = shift(from, Math.floor(between(from, t) / 2));
    washes = genDates(nA, from, mid); const lw = washes.at(-1) || mid;
    wears = [...genDates(nW - nS, from, shift(lw, -1)), ...genDates(nS, shift(lw, 1), yest)];
  } else { washes = genDates(nA, from, yest); wears = genDates(nW, from, yest); } // backfill never logs today; the Wear/Wash buttons own today
  const j = { id: uid(), brand, model, purchaseDate: date || '', price: price || null, wears: [...new Set(wears)].sort(), washes, photos: [], ci: FS.ci ?? freeLook() };
  const o = lookOwner(j.ci, null), oPrev = o?.ci;
  if (o) o.ci = -1; // ensureColors gives the other pair the next free look
  DB.jeans.push(j); ensureColors();
  if (!save()) { DB.jeans.pop(); if (o) o.ci = oPrev; return; }
  go('detail', j.id);
  const short = [];
  if (j.wears.length < nW) short.push(`${j.wears.length} of ${nW} wears`);
  if (washes.length < nA) short.push(`${washes.length} of ${nA} washes`);
  toast(short.length ? `Added · only ${short.join(', ')} fit the date range` : 'Added to the rack', null, short.length ? 3600 : 1800);
}

function resizeImage(file, max = 640, quality = 0.7, asBlob = false) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      if (!asBlob) return res(c.toDataURL('image/jpeg', quality));
      c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

  const file = input.files[0]; input.value = '';
  const j = findJ(CUR.id); if (!file || !j) return;
  if (!/^image\//.test(file.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(file.name)) return toast('Choose an image file');
  // With IndexedDB there is room for sharper photos; the localStorage fallback keeps them small.
  let img; try { img = pdb ? await resizeImage(file, 1440, 0.82, true) : await resizeImage(file); } catch (e) { return toast('Could not read that image'); }
  const snap = clone(j), d = today(), key = pkey(j.id, d);
  let entry = null, stored = false; const prevSrc = PHOTOS.get(key);
  if (pdb) { try { await putPhotos([[key, img]]); PHOTOS.set(key, img); entry = { date: d }; stored = true; } catch (e) { /* fall back to inline */ } }
  if (!entry) { try { entry = { date: d, src: await asDataURL(img) }; } catch (e) { return toast('Could not read that image'); } }
  const replaced = j.photos.some(p => p.date === d);
  j.photos = [...j.photos.filter(p => p.date !== d), entry].sort((a, b) => a.date.localeCompare(b.date));
  if (!save()) {
    // Put back the image this one overwrote, so the restored entry still shows the old photo.
    if (stored) { (prevSrc ? putPhotos([[key, prevSrc]]) : delPhotos([key])).catch(() => {}); if (prevSrc) PHOTOS.set(key, prevSrc); else PHOTOS.delete(key); }
    return rollback(snap);
  }
  render(); toast(replaced ? 'Photo replaced · one per day' : 'Photo added');
}
async function removePhoto(id, date) {
  const j = findJ(id); if (!j) return;
  if (!await showConfirm(`Remove the photo from ${fmt(date)}?`, 'Remove')) return;
  const snap = clone(j); j.photos = j.photos.filter(p => p.date !== date);
  if (!save()) return rollback(snap);
  render(); toast('Photo removed', () => restore(snap));
}

// ── Export / Import ──
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
// iPhone home-screen apps can't save blob downloads reliably; use the share sheet (Save to Files) when available.
async function deliver(name, text, type, done = '') {
  try {
    const file = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
  } catch (e) {
    if (e && e.name === 'AbortError') return false;
    // Preparing photos can outlast the tap that started the export; iOS then needs one more tap to open the share sheet.
    if (e && e.name === 'NotAllowedError') { toast('Backup ready', () => deliver(name, text, type, done).then(ok => ok && done && toast(done)), 10000, 'SAVE'); return false; }
  }
  download(name, text, type); return true;
}
// Backups always embed the images, so they restore on any device.
async function exportData() {
  const one = async (j, p) => { const v = photoData(j, p); if (!v) return null; try { return { date: p.date, src: await asDataURL(v) }; } catch (e) { return null; } };
  const jeans = await Promise.all(DB.jeans.map(async j => ({ ...j, photos: (await Promise.all(j.photos.map(p => one(j, p)))).filter(Boolean) })));
  return { ...DB, jeans };
}
async function exportJSON() {
  const data = await exportData(), count = list => list.reduce((a, j) => a + j.photos.length, 0), missing = count(DB.jeans) - count(data.jeans);
  const msg = missing ? `JSON exported · ${plural(missing, 'photo')} unavailable` : 'JSON exported';
  if (await deliver('denim-tracker-backup-' + today() + '.json', JSON.stringify(data, null, 2), 'application/json', msg)) toast(msg, null, missing ? 3600 : 1800);
}
function exportCSV() {
  // Quote per RFC 4180; prefix formula-like cells so spreadsheets don't execute them.
  const q = v => { let s = v == null ? '' : String(v); if (/^[=+\-@\t\r]/.test(s) && !/^-?\d/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['brand', 'model', 'purchase_date', 'price', 'currency', 'event', 'date']];
  DB.jeans.forEach(j => {
    const ev = [...j.wears.map(d => ['wear', d]), ...j.washes.map(d => ['wash', d])].sort((a, b) => a[1].localeCompare(b[1]));
    if (!ev.length) rows.push([j.brand, j.model, j.purchaseDate, j.price, currency, '', '']);
    ev.forEach(([e, d]) => rows.push([j.brand, j.model, j.purchaseDate, j.price, currency, e, d]));
  });
  deliver('denim-tracker-' + today() + '.csv', '\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv').then(ok => ok && toast('CSV exported'));
}
function handleImport(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  file.text().then(async txt => {
    let data; try { data = JSON.parse(txt); } catch (e) { return toast('Not a valid JSON file'); }
    const arr = Array.isArray(data) ? data : data && Array.isArray(data.jeans) ? data.jeans : null;
    if (!arr) return toast('No pairs found in file');
    const jeans = arr.map(normalize).filter(Boolean);
    if (!jeans.length) return toast('No valid pairs found in file');
    const seen = new Set(); jeans.forEach(j => { if (seen.has(j.id)) j.id = uid(); seen.add(j.id); });
    if (DB.jeans.length && !await showConfirm(`Replace your ${plural(DB.jeans.length, 'pair')} with ${plural(jeans.length, 'pair')} from this backup?`, 'Replace')) return;
    const prev = DB; DB = { ...(Array.isArray(data) ? {} : data), jeans }; ensureColors();
    const keys = []; jeans.forEach(j => j.photos.forEach(p => { if (p.src) keys.push(pkey(j.id, p.date)); }));
    const before = new Map(keys.filter(k => PHOTOS.has(k)).map(k => [k, PHOTOS.get(k)]));
    // Move images into IndexedDB first, so a photo-heavy backup doesn't overflow localStorage on save.
    if (pdb) { try { await migratePhotos(false); } catch (e) { /* keep inline; save below decides */ } }
    if (!save()) {
      DB = prev;
      // Undo the image writes so existing pairs keep their own photos.
      if (pdb && keys.length) {
        const added = keys.filter(k => !before.has(k));
        try { if (before.size) await putPhotos([...before]); if (added.length) await delPhotos(added); } catch (e) {}
        before.forEach((v, k) => PHOTOS.set(k, v)); added.forEach(k => PHOTOS.delete(k));
      }
      return render();
    }
    toast('Backup restored'); delete scrollPos.col; go('col');
  }, () => toast('Could not read file'));
}

if ('serviceWorker' in navigator) {
  // Reload once when a new version takes over, so the update shows without a second launch.
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  const reloadWhenSafe = () => { if (reloaded) return; if (CUR.view === 'form') return setTimeout(reloadWhenSafe, 2000); reloaded = true; location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) reloadWhenSafe(); });
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}

async function init() {
  load(); go('col');
  try { pdb = await openPDB(); await loadAllPhotos(); } catch (e) { pdb = null; PHOTOS_READY = true; render(); return; }
  try { await upgradeStoredPhotos(); } catch (e) {}
  // Migration failures leave photos inline (still visible); the store stays usable.
  // Cleanup only runs when the saved data was read successfully, so a failed read can never delete photos.
  try { await migratePhotos(); if (LOAD_OK && DB.jeans.length) gcPhotos(); } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  PHOTOS_READY = true; render();
}
init();
</script>
